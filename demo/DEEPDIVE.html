<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <!-- 全局氛围叠加 -->
    <div id="vignette" class="overlay"></div>
    <div id="grain" class="overlay"></div>
    <div id="fade" class="overlay"></div>

    <!-- 标题首屏 -->
    <section id="title" aria-label="标题">
      <div class="title-meta">
        <span>案件档案 № 044</span>
        <span>YUCATÁN · MX</span>
      </div>
      <div class="title-core">
        <h1 class="brand">DEEP<span>DIVE</span></h1>
        <div class="brand-cn" aria-hidden="true">深潜</div>
        <p class="tagline">三个月前，萝拉·卡尔潜入「寂静之井」。<br />昨天，她的手电还亮着。</p>
        <button id="start" type="button">
          <em>开始下潜</em>
          <small>建议戴上耳机 · 桌面 WASD+鼠标 / 手机 双摇杆</small>
        </button>
      </div>
      <div class="title-foot">
        <span>寂静天坑事件 · 第一章</span>
        <span class="blink">▍REC</span>
      </div>
    </section>

    <!-- 潜水 HUD -->
    <section id="hud" class="hidden" aria-hidden="true">
      <div id="o2wrap">
        <div id="o2label">O₂</div>
        <div id="o2gauge"><div id="o2fill"></div></div>
        <div id="o2pct">100</div>
        <div id="n2wrap">
          <div id="n2label">N₂</div>
          <div id="n2gauge"><div id="n2fill"></div></div>
        </div>
      </div>
      <div id="depthwrap">
        <div id="depth">0.0</div>
        <div id="depthlabel">DEPTH · M</div>
      </div>
      <div id="compass">CENOTE DEL SILENCIO</div>
      <div id="deco" class="hidden">
        <div id="deco-label">减压停留 · HOLD −5M</div>
        <div id="deco-time">0:40</div>
        <div id="deco-hint">保持在 −4 ~ −7M 深度带</div>
      </div>
      <div id="guide" class="hidden">
        <div id="guide-arrow">▲</div>
        <div id="guide-label">导览线</div>
      </div>
    </section>

    <!-- 字幕 -->
    <div id="subtitle" class="hidden"></div>

    <!-- 写字板 -->
    <section id="slate" class="hidden">
      <div id="slate-card">
        <div id="slate-head">潜水写字板 · 回收物证</div>
        <div id="slate-text"></div>
        <div id="slate-foot">按任意处继续</div>
      </div>
    </section>

    <!-- 结局画面 -->
    <section id="ending" class="hidden">
      <div id="ending-quote"></div>
      <div id="ending-stat"></div>
      <div id="ending-brand">DEEPDIVE</div>
      <button id="restart" type="button">重新下潜</button>
    </section>

    <!-- 移动端控制 -->
    <div id="touch" class="hidden">
      <div id="stick"><div id="stick-nub"></div></div>
    </div>
  </div>
</body>
</html>
